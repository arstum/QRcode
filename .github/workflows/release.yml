name: Build and Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (optional, defaults to v<versionName>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Resolve version and release tag
        id: meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName[[:space:]]*=' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode[[:space:]]*=' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          VERSION_NAME="${VERSION_NAME:-1.0}"
          VERSION_CODE="${VERSION_CODE:-1}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG_NAME:-}" ]; then
            RELEASE_TAG="${INPUT_TAG_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi

          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
          } >> "$GITHUB_ENV"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run unit tests
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -x ./gradlew ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/my-upload-key.jks"
            export KEYSTORE_PATH="${RUNNER_TEMP}/my-upload-key.jks"
            "${GRADLE_CMD}" :app:assembleRelease
            APK_SRC=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
            if [ -z "${APK_SRC}" ]; then
              echo "Release APK not found" >&2
              exit 1
            fi
            cp "${APK_SRC}" "dist/QRcode-v${VERSION_NAME}-release.apk"
          else
            echo "Release signing secrets not configured; building debug-signed APK instead."
            "${GRADLE_CMD}" :app:assembleDebug
            APK_SRC=$(find app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1)
            if [ -z "${APK_SRC}" ]; then
              echo "Debug APK not found" >&2
              exit 1
            fi
            cp "${APK_SRC}" "dist/QRcode-v${VERSION_NAME}-debug.apk"
          fi

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "QRcode ${{ env.RELEASE_TAG }} (build ${{ env.VERSION_CODE }})"
          generate_release_notes: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
